# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: paratera
    model: DeepSeek-V4.1-Flash
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: standard
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openrouter:
        models:
          - id: ~deepseek/deepseek-flash-latest
            name: "DeepSeek: DeepSeek Flash Latest"
            contextWindow: 1048576
            maxTokens: 943718
            input:
              - text
              - image
          - id: ~z-ai/glm-flash-latest
            name: "Z.ai: GLM Flash Latest"
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
          - id: ~z-ai/glm-latest
            name: "Z.ai: GLM Latest"
            contextWindow: 1048576
            maxTokens: 943718
            input:
              - text
          - id: deepseek/deepseek-v4-flash-0731
            name: "DeepSeek: DeepSeek V4 Flash 0731"
            contextWindow: 1048576
            maxTokens: 943718
            input:
              - text
          - id: moonshotai/kimi-k3
            name: "MoonshotAI: Kimi K3"
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
          - id: moonshotai/kimi-k3:batch
            name: "MoonshotAI: Kimi K3 (batch)"
            contextWindow: 1048576
            maxTokens: 16384
            input:
              - text
              - image
          - id: qwen/qwen3.8-max-prime
            name: "Qwen: Qwen3.8 Max Prime"
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: qwen/qwen3.8-omni-flash
            name: "Qwen: Qwen3.8 Omni Flash"
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
        apiKeyEnv: OPENROUTER_API_KEY
      paratera:
        displayName: paratera
        apiKeyEnv: PARATERA_API_KEY
        api: openai-completions
        baseURL: https://llmapi.paratera.com/v1
        models:
          - id: DeepSeek-V4-Flash-0731
            name: DeepSeek-V4-Flash-0731
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek-V4.1-Flash
          - id: GLM-5.3
            name: GLM-5.3
          - id: GLM-5.3-Flash
            name: GLM-5.3-Flash
          - id: Kimi-K3
            name: Kimi-K3
# Pin web search to the OpenAlex provider registered by the research-tools
# bundle, so a search never depends on the DeepSeek credential this profile has
# not stored. `fetchProvider` is left unset: research-tools registers no fetch
# provider, so the shipped HTTP fetcher keeps auto-selecting.
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: scholar
    fetchProvider: http
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis

# Bundles installed from ~/dotfiles/dsh/plugins (see ../README.md). Editing a
# bundle's JavaScript needs a composition reload to re-import it: an edit to
# this file is one, a bare file write is not.
#   @aman/dsh-personal-presets  the `paper` and `general-assistant` presets
#   @aman/dsh-research-tools    Zotero, a Neovim bridge, scholarly search, research context
#   @aman/dsh-chat              one plain model call, as the `chat` tool and /chat
