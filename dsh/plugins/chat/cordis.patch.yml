# chat: one plain model call, reachable as the `chat` tool, the /chat command,
# and the Chat sidebar panel, whose browser half posts to /api/aman-chat/ask.
# No agent, no tools, no loop - the provider is queried once and its reply comes
# back as text.
- insert:
    - id: chat
      name: '@aman/dsh-chat'
      config:
        # Default target. Both can be overridden per call by the chat tool.
        provider: paratera
        model: DeepSeek-V4.1-Flash
        maxChars: 12000
